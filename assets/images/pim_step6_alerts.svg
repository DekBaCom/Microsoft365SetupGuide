<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="PIM - Alerts configuration">
  <rect width="800" height="450" fill="#faf9f8"/>
  <rect width="800" height="48" fill="#0062ad"/>
  <text x="20" y="31" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Microsoft Entra admin center</text>
  <text x="780" y="31" fill="white" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" opacity="0.85">PIM &gt; Microsoft Entra roles &gt; Alerts</text>
  <!-- Left nav -->
  <rect x="0" y="48" width="210" height="402" fill="#edebe9"/>
  <text x="18" y="80" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Identity governance</text>
  <rect x="0" y="88" width="210" height="22" fill="#deecf9"/>
  <rect x="0" y="88" width="3" height="22" fill="#0062ad"/>
  <text x="32" y="103" fill="#0062ad" font-family="Segoe UI, Arial" font-size="11" font-weight="600">PIM &gt; Microsoft Entra roles</text>
  <text x="64" y="124" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Assignments</text>
  <text x="64" y="142" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Settings</text>
  <text x="64" y="160" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Access reviews</text>
  <text x="64" y="178" fill="#0062ad" font-family="Segoe UI, Arial" font-size="10" font-weight="600">Alerts</text>
  <!-- Page title -->
  <text x="230" y="76" fill="#323130" font-family="Segoe UI, Arial" font-size="20" font-weight="300">Alerts</text>
  <text x="230" y="96" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Review and tune PIM built-in security alerts</text>
  <!-- Table header -->
  <rect x="230" y="108" width="540" height="28" fill="#f3f2f1"/>
  <text x="245" y="127" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Alert</text>
  <text x="530" y="127" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Threshold</text>
  <text x="660" y="127" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Severity</text>
  <!-- Alert rows -->
  <rect x="230" y="136" width="540" height="38" fill="white"/>
  <text x="245" y="158" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Too many permanent owners assigned to a role</text>
  <rect x="528" y="143" width="60" height="22" fill="#f3f2f1" rx="2"/>
  <text x="558" y="158" fill="#323130" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">2</text>
  <text x="660" y="158" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">High</text>
  <line x1="230" y1="174" x2="770" y2="174" stroke="#edebe9"/>
  <rect x="230" y="174" width="540" height="38" fill="white"/>
  <text x="245" y="196" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Too many owners assigned to a role</text>
  <rect x="528" y="181" width="60" height="22" fill="#f3f2f1" rx="2"/>
  <text x="558" y="196" fill="#323130" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">5</text>
  <text x="660" y="196" fill="#d83b01" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Medium</text>
  <line x1="230" y1="212" x2="770" y2="212" stroke="#edebe9"/>
  <rect x="230" y="212" width="540" height="38" fill="white"/>
  <text x="245" y="234" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Roles are being activated too frequently</text>
  <rect x="528" y="219" width="90" height="22" fill="#f3f2f1" rx="2"/>
  <text x="573" y="234" fill="#323130" font-family="Segoe UI, Arial" font-size="11" text-anchor="middle" font-weight="600">2 / 24 h</text>
  <text x="660" y="234" fill="#d83b01" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Medium</text>
  <line x1="230" y1="250" x2="770" y2="250" stroke="#edebe9"/>
  <!-- Two zero-tolerance rows -->
  <rect x="230" y="250" width="540" height="38" fill="#fff4ce"/>
  <text x="245" y="272" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Roles don't require MFA for activation</text>
  <text x="558" y="272" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle">—</text>
  <text x="660" y="272" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">High</text>
  <text x="740" y="272" fill="#107c10" font-family="Segoe UI, Arial" font-size="11" font-weight="600">On</text>
  <line x1="230" y1="288" x2="770" y2="288" stroke="#edebe9"/>
  <rect x="230" y="288" width="540" height="38" fill="#fff4ce"/>
  <text x="245" y="310" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Roles don't require justification for activation</text>
  <text x="558" y="310" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle">—</text>
  <text x="660" y="310" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">High</text>
  <text x="740" y="310" fill="#107c10" font-family="Segoe UI, Arial" font-size="11" font-weight="600">On</text>
  <!-- Red box around zero-tolerance rows -->
  <rect x="228" y="248" width="544" height="80" fill="none" stroke="#d13438" stroke-width="2"/>
  <text x="772" y="272" fill="#d13438" font-family="Segoe UI, Arial" font-size="10" text-anchor="start"> </text>
  <!-- Purview callout -->
  <rect x="230" y="338" width="540" height="80" fill="#eff6fc" rx="4"/>
  <text x="248" y="360" fill="#0062ad" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Also configure in Microsoft Purview (compliance.microsoft.com):</text>
  <text x="248" y="382" fill="#323130" font-family="Segoe UI, Arial" font-size="12">• Alert policy: "Added member to Role"  → severity High → notify SOC</text>
  <text x="248" y="402" fill="#323130" font-family="Segoe UI, Arial" font-size="12">• Alert policy: "Activated eligible role"  → route to SIEM / SOC mailbox</text>
</svg>
