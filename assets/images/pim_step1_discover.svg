<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Microsoft Entra PIM - Role assignments discovery">
  <!-- Header -->
  <rect width="800" height="450" fill="#faf9f8"/>
  <rect width="800" height="48" fill="#0062ad"/>
  <text x="20" y="31" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Microsoft Entra admin center</text>
  <text x="780" y="31" fill="white" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" opacity="0.85">entra.microsoft.com</text>
  <!-- Left nav -->
  <rect x="0" y="48" width="210" height="402" fill="#edebe9"/>
  <text x="18" y="80" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Identity</text>
  <text x="18" y="104" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Protection</text>
  <text x="18" y="128" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Applications</text>
  <rect x="0" y="140" width="210" height="26" fill="#deecf9"/>
  <rect x="0" y="140" width="3" height="26" fill="#0062ad"/>
  <text x="18" y="157" fill="#0062ad" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Identity governance</text>
  <text x="32" y="180" fill="#0062ad" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Privileged Identity Mgmt</text>
  <text x="48" y="200" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Microsoft Entra roles</text>
  <text x="64" y="218" fill="#0062ad" font-family="Segoe UI, Arial" font-size="10" font-weight="600">Assignments</text>
  <text x="64" y="236" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Settings</text>
  <text x="64" y="254" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Access reviews</text>
  <text x="64" y="272" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Alerts</text>
  <!-- Main content -->
  <text x="230" y="82" fill="#323130" font-family="Segoe UI, Arial" font-size="20" font-weight="300">Assignments</text>
  <text x="230" y="102" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Microsoft Entra roles — review who holds privileged access</text>
  <!-- Tab bar -->
  <rect x="230" y="118" width="540" height="32" fill="#f3f2f1"/>
  <rect x="230" y="118" width="100" height="32" fill="white"/>
  <rect x="230" y="148" width="100" height="2" fill="#0062ad"/>
  <text x="280" y="139" fill="#0062ad" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">Active</text>
  <text x="380" y="139" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle">Eligible</text>
  <!-- Table header -->
  <rect x="230" y="150" width="540" height="28" fill="#f3f2f1"/>
  <text x="245" y="169" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Role</text>
  <text x="460" y="169" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Principal</text>
  <text x="640" y="169" fill="#323130" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Assignment type</text>
  <!-- Row 1 — excess GA -->
  <rect x="230" y="178" width="540" height="36" fill="#fff4ce"/>
  <text x="245" y="200" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Global Administrator</text>
  <text x="460" y="200" fill="#323130" font-family="Segoe UI, Arial" font-size="12">admin1@contoso.com</text>
  <text x="640" y="200" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Permanent</text>
  <line x1="230" y1="214" x2="770" y2="214" stroke="#edebe9"/>
  <!-- Row 2 -->
  <rect x="230" y="214" width="540" height="36" fill="#fff4ce"/>
  <text x="245" y="236" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Global Administrator</text>
  <text x="460" y="236" fill="#323130" font-family="Segoe UI, Arial" font-size="12">admin2@contoso.com</text>
  <text x="640" y="236" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Permanent</text>
  <line x1="230" y1="250" x2="770" y2="250" stroke="#edebe9"/>
  <!-- Row 3 — break-glass OK -->
  <rect x="230" y="250" width="540" height="36" fill="white"/>
  <text x="245" y="272" fill="#323130" font-family="Segoe UI, Arial" font-size="12">Global Administrator</text>
  <text x="460" y="272" fill="#323130" font-family="Segoe UI, Arial" font-size="12">breakglass1@contoso.onmicrosoft.com</text>
  <text x="640" y="272" fill="#107c10" font-family="Segoe UI, Arial" font-size="12">Permanent ✓</text>
  <line x1="230" y1="286" x2="770" y2="286" stroke="#edebe9"/>
  <!-- Row 4 -->
  <rect x="230" y="286" width="540" height="36" fill="#fff4ce"/>
  <text x="245" y="308" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Security Administrator</text>
  <text x="460" y="308" fill="#323130" font-family="Segoe UI, Arial" font-size="12">secops@contoso.com</text>
  <text x="640" y="308" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Permanent</text>
  <line x1="230" y1="322" x2="770" y2="322" stroke="#edebe9"/>
  <!-- Row 5 -->
  <rect x="230" y="322" width="540" height="36" fill="#fff4ce"/>
  <text x="245" y="344" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Exchange Administrator</text>
  <text x="460" y="344" fill="#323130" font-family="Segoe UI, Arial" font-size="12">exadmin@contoso.com</text>
  <text x="640" y="344" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Permanent</text>
  <!-- Warning callout -->
  <rect x="230" y="376" width="540" height="52" fill="#fde7e9" rx="4"/>
  <text x="250" y="398" fill="#a4262c" font-family="Segoe UI, Arial" font-size="12" font-weight="600">⚠ 4 permanent Global Administrator assignments detected</text>
  <text x="250" y="416" fill="#605e5c" font-family="Segoe UI, Arial" font-size="11">Target: ≤ 2 (break-glass only). Convert highlighted rows to Eligible in Step 3.</text>
  <!-- Red highlight box around the yellow rows -->
  <rect x="228" y="176" width="544" height="150" fill="none" stroke="#d13438" stroke-width="2" stroke-dasharray="6,3"/>
</svg>
