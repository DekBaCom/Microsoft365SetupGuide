<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Zero Trust - Data pillar: Sensitivity Labels and DLP rules">
  <rect width="800" height="450" fill="#faf9f8"/>
  <rect width="800" height="48" fill="#5c2d91"/>
  <text x="20" y="31" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Microsoft Purview</text>
  <text x="780" y="31" fill="white" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" opacity="0.85">Data classification &gt; Sensitivity Labels</text>
  <!-- Left nav -->
  <rect x="0" y="48" width="200" height="402" fill="#edebe9"/>
  <text x="18" y="80" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Data classification</text>
  <rect x="0" y="88" width="200" height="22" fill="#deecf9"/>
  <rect x="0" y="88" width="3" height="22" fill="#5c2d91"/>
  <text x="32" y="103" fill="#5c2d91" font-family="Segoe UI, Arial" font-size="11" font-weight="600">Sensitive info types</text>
  <text x="18" y="130" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Data loss prevention</text>
  <text x="32" y="150" fill="#605e5c" font-family="Segoe UI, Arial" font-size="11">DLP policies</text>
  <!-- Main content -->
  <text x="220" y="82" fill="#323130" font-family="Segoe UI, Arial" font-size="20" font-weight="300">Sensitivity Labels — Zero Trust data classification</text>
  <text x="220" y="104" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Auto-label content based on Thai personal data indicators (ID, passport, email)</text>
  <!-- Label 1: Public -->
  <rect x="220" y="120" width="170" height="140" fill="white" stroke="#edebe9" rx="4"/>
  <rect x="220" y="120" width="170" height="34" fill="#f0f0f0" rx="4 4 0 0"/>
  <text x="305" y="142" fill="#323130" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">Public</text>
  <text x="235" y="168" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Encryption:</text>
  <text x="235" y="182" fill="#323130" font-family="Segoe UI, Arial" font-size="11">None</text>
  <text x="235" y="198" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Sharing:</text>
  <text x="235" y="212" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Public (anyone)</text>
  <text x="235" y="228" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Auto-detect:</text>
  <text x="235" y="242" fill="#323130" font-family="Segoe UI, Arial" font-size="11">None</text>
  <!-- Label 2: Internal -->
  <rect x="405" y="120" width="170" height="140" fill="white" stroke="#edebe9" rx="4"/>
  <rect x="405" y="120" width="170" height="34" fill="#fff4ce" rx="4 4 0 0"/>
  <text x="490" y="142" fill="#323130" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">Internal</text>
  <text x="420" y="168" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Encryption:</text>
  <text x="420" y="182" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Standard</text>
  <text x="420" y="198" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Sharing:</text>
  <text x="420" y="212" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Org only</text>
  <text x="420" y="228" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Auto-detect:</text>
  <text x="420" y="242" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Generic PII</text>
  <!-- Label 3: Confidential -->
  <rect x="590" y="120" width="170" height="140" fill="white" stroke="#edebe9" rx="4"/>
  <rect x="590" y="120" width="170" height="34" fill="#fde7e9" rx="4 4 0 0"/>
  <text x="675" y="142" fill="#323130" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" font-weight="600">Confidential</text>
  <text x="605" y="168" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Encryption:</text>
  <text x="605" y="182" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Strong (IRM)</text>
  <text x="605" y="198" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Sharing:</text>
  <text x="605" y="212" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Restricted list</text>
  <text x="605" y="228" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Auto-detect:</text>
  <text x="605" y="242" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Thai ID, Passport</text>
  <!-- DLP section -->
  <rect x="220" y="280" width="540" height="142" fill="#eff6fc" rx="4"/>
  <text x="235" y="302" fill="#0078d4" font-family="Segoe UI, Arial" font-size="12" font-weight="600">📋 DLP Rule: Prevent Thai Personal Data Exfiltration</text>
  <text x="235" y="322" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Rule: If content contains "Thailand Population Identification Code" (13-digit ID)</text>
  <text x="235" y="338" fill="#323130" font-family="Segoe UI, Arial" font-size="11">AND is shared externally (outside org) → Block + Alert admin</text>
  <text x="235" y="358" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Also monitor: Thai passport number, sensitive health data (ICD-10)</text>
  <text x="235" y="378" fill="#323130" font-family="Segoe UI, Arial" font-size="11">Applies to: Exchange, SharePoint, OneDrive, Teams, Endpoint devices</text>
  <text x="235" y="398" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10" font-style="italic">Status: Deploy in Audit mode first (14 days), then enable Block.</text>
</svg>
