title: Microsoft 365 Setup Guide
description: >-
  End-to-end deployment guide for Microsoft 365 — tenant configuration,
  Microsoft Entra ID, Microsoft Intune, Collaboration Governance,
  and 59+ ready-to-use PowerShell automation scripts.
baseurl: "/Microsoft365SetupGuide"
url: "https://DekBaCom.github.io"
lang: en-US

remote_theme: just-the-docs/just-the-docs@v0.10.0

# SEO / jekyll-seo-tag metadata
author:
  name: Abdulloh Etaeluengoh
  email: Abdulloh.eg@gmail.com

logo: /assets/images/favicon.png
social:
  name: Abdulloh Etaeluengoh
  links:
    - https://www.linkedin.com/in/abdulloh-etaeluengoh
    - https://github.com/DekBaCom

# Per-page SEO defaults (jekyll-seo-tag reads these)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/favicon.png

# Copy-to-clipboard button on all code blocks (just-the-docs built-in)
enable_copy_code_button: true

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Aux links in header
aux_links:
  "GitHub":
    - "https://github.com/DekBaCom/Microsoft365SetupGuide"

aux_links_new_tab: true

# Navigation
nav_sort: order

# Footer
footer_content: "Developed by <a href=\"https://www.linkedin.com/in/abdulloh-etaeluengoh\" target=\"_blank\">Mr. Abdulloh Etaeluengoh</a> &mdash; Microsoft 365 Solution Architect &nbsp;|&nbsp; <a href=\"https://github.com/DekBaCom\" target=\"_blank\">&#x1F4BE; GitHub: DekBaCom</a> &nbsp;|&nbsp; Microsoft 365 Setup Guide &copy; 2024. Powered by <a href=\"https://pages.github.com/\">GitHub Pages</a> &amp; <a href=\"https://just-the-docs.com/\">Just the Docs</a>."

# Color scheme
color_scheme: light

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Last edit timestamp
last_edit_time_format: "%b %e %Y at %I:%M %p"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
