<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Zero Trust - App pillar: App Protection Policies">
  <rect width="800" height="450" fill="#faf9f8"/>
  <rect width="800" height="48" fill="#7fba00"/>
  <text x="20" y="31" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Microsoft Intune admin center</text>
  <text x="780" y="31" fill="white" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" opacity="0.85">Apps &gt; App protection policies</text>
  <!-- Left nav -->
  <rect x="0" y="48" width="200" height="402" fill="#edebe9"/>
  <text x="18" y="80" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Apps</text>
  <rect x="0" y="88" width="200" height="22" fill="#deecf9"/>
  <rect x="0" y="88" width="3" height="22" fill="#7fba00"/>
  <text x="32" y="103" fill="#7fba00" font-family="Segoe UI, Arial" font-size="11" font-weight="600">App protection policies</text>
  <text x="32" y="124" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Mobile App Management</text>
  <!-- Main content -->
  <text x="220" y="82" fill="#323130" font-family="Segoe UI, Arial" font-size="20" font-weight="300">App Protection Policy — iOS</text>
  <text x="220" y="104" fill="#605e5c" font-family="Segoe UI, Arial" font-size="12">Zero Trust app baseline — BYOD-safe, works office + personal devices</text>
  <!-- Policy settings in columns -->
  <!-- Left column -->
  <text x="220" y="130" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">📱 Access controls</text>
  <line x1="220" y1="136" x2="490" y2="136" stroke="#edebe9" stroke-width="1"/>
  <text x="220" y="156" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">PIN for access</text>
  <rect x="420" y="142" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="157" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="176" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Require work contact access</text>
  <rect x="420" y="162" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="177" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="196" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Block jailbroken / rooted</text>
  <rect x="420" y="182" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="197" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="216" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Require screen lock</text>
  <rect x="420" y="202" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="217" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <!-- Data controls -->
  <text x="220" y="246" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">🔐 Data controls</text>
  <line x1="220" y1="252" x2="490" y2="252" stroke="#edebe9" stroke-width="1"/>
  <text x="220" y="272" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Encrypt app data</text>
  <rect x="420" y="258" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="273" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="292" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Prevent screen capture</text>
  <rect x="420" y="278" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="293" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="312" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Block copy/paste to unmanaged</text>
  <rect x="420" y="298" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="313" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <text x="220" y="332" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Restrict web content to managed browser</text>
  <rect x="420" y="318" width="40" height="22" fill="#107c10" rx="11"/>
  <text x="440" y="333" fill="white" font-family="Segoe UI, Arial" font-size="11" font-weight="600" text-anchor="middle">On</text>
  <!-- Right column -->
  <text x="510" y="130" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">🚫 Enforcement actions</text>
  <line x1="510" y1="136" x2="780" y2="136" stroke="#edebe9" stroke-width="1"/>
  <text x="510" y="156" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Session timeout (inactivity)</text>
  <rect x="670" y="142" width="80" height="22" fill="#f3f2f1" rx="2"/>
  <text x="680" y="157" fill="#323130" font-family="Segoe UI, Arial" font-size="11" text-anchor="middle">15 min</text>
  <text x="510" y="176" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">Max offline grace period</text>
  <rect x="670" y="162" width="80" height="22" fill="#f3f2f1" rx="2"/>
  <text x="680" y="177" fill="#323130" font-family="Segoe UI, Arial" font-size="11" text-anchor="middle">1 day</text>
  <text x="510" y="196" fill="#605e5c" font-family="Segoe UI, Arial" font-size="10">When non-compliant:</text>
  <rect x="670" y="182" width="80" height="22" fill="#f3f2f1" rx="2"/>
  <text x="680" y="197" fill="#323130" font-family="Segoe UI, Arial" font-size="11" text-anchor="middle">Wipe data</text>
  <!-- Target apps -->
  <text x="510" y="230" fill="#323130" font-family="Segoe UI, Arial" font-size="12" font-weight="600">📋 Targeted apps</text>
  <line x1="510" y1="236" x2="780" y2="236" stroke="#edebe9" stroke-width="1"/>
  <text x="510" y="258" fill="#323130" font-family="Segoe UI, Arial" font-size="11">• Microsoft Teams</text>
  <text x="510" y="274" fill="#323130" font-family="Segoe UI, Arial" font-size="11">• Outlook</text>
  <text x="510" y="290" fill="#323130" font-family="Segoe UI, Arial" font-size="11">• OneDrive</text>
  <text x="510" y="306" fill="#323130" font-family="Segoe UI, Arial" font-size="11">• SharePoint</text>
  <text x="510" y="322" fill="#323130" font-family="Segoe UI, Arial" font-size="11">• Word, Excel, PowerPoint</text>
  <!-- Note at bottom -->
  <rect x="220" y="362" width="560" height="52" fill="#dff6dd" rx="4"/>
  <text x="235" y="384" fill="#107c10" font-family="Segoe UI, Arial" font-size="11" font-weight="600">✓ Zero Trust Mobile App Security</text>
  <text x="235" y="402" fill="#323130" font-family="Segoe UI, Arial" font-size="11">These policies enforce security on personal + corporate devices without requiring full MDM enrollment. Protects org data while respecting BYOD use case.</text>
</svg>
